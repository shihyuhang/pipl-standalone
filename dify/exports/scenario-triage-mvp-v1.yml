    - data:
        code: |-
          import json

          SENSITIVE_KEYS = {
              'privacycontactname', 'privacycontactchannel', 'privacy_contact_name',
              'privacy_contact_channel', 'contact_name', 'contact_channel', 'email',
              'phone', 'mobile', 'password', 'secret', 'token', 'api_key', 'apikey'
          }

          def parse_object(raw, label, warnings):
              try:
                  value = json.loads(raw or '{}')
                  if not isinstance(value, dict):
                      warnings.append(label + '不是 JSON 对象，已按空对象处理')
                      return {}
                  return value
              except Exception:
                  warnings.append(label + '无法解析，已按空对象处理')
                  return {}

          def scrub(value):
              if isinstance(value, dict):
                  result = {}
                  for key, item in value.items():
                      normalized = str(key).replace('-', '_').lower()
                      compact = normalized.replace('_', '')
                      if normalized in SENSITIVE_KEYS or compact in SENSITIVE_KEYS:
                          continue
                      result[key] = scrub(item)
                  return result
              if isinstance(value, list):
                  return [scrub(item) for item in value[:100]]
              if isinstance(value, str):
                  return value[:5000]
              return value

          def main(schema_version: str, run_id: str, workflow_code: str,
                   enterprise_context: str, scenario_context: str,
                   confirmed_facts: str = '{}'):
              warnings = []
              enterprise = scrub(parse_object(enterprise_context, '企业画像', warnings))
              scenario = scrub(parse_object(scenario_context, '业务场景', warnings))
              facts = scrub(parse_object(confirmed_facts, '已确认事实', warnings))

              if schema_version != '1.0.0':
                  warnings.append('Schema 版本不是 1.0.0')
              if workflow_code != 'scenario_triage':
                  warnings.append('工作流编码不是 scenario_triage')
              if not scenario:
                  warnings.append('业务场景为空，需要补充业务事实')

              context = {
                  'schema_version': schema_version,
                  'run_id': run_id,
                  'workflow_code': workflow_code,
                  'enterprise': enterprise,
                  'scenario': scenario,
                  'confirmed_facts': facts,
                  'precheck_warnings': warnings
              }
              return {
                  'context_json': json.dumps(context, ensure_ascii=False),
                  'precheck_warnings': json.dumps(warnings, ensure_ascii=False)
              }
        code_language: python3
        desc: 解析三个 JSON 输入，剔除联系人、密钥等不应发送给模型的字段，并形成受控上下文。
        outputs:
